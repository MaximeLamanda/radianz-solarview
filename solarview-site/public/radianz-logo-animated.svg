<svg width="87" height="64" viewBox="0 0 87 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Logo RADIANZ animé" role="img">
  <style>
    .bar {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation: assemble 0.75s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .bar--horizontal { --tx: -28px; --ty: 0px; animation-delay: 0.05s; }
    .bar--top { --tx: 0px; --ty: -24px; animation-delay: 0.15s; }
    .bar--bottom { --tx: 0px; --ty: 24px; animation-delay: 0.25s; }
    .bar--diag-top { --tx: 22px; --ty: -22px; animation-delay: 0.35s; }
    .bar--diag-bottom { --tx: 22px; --ty: 22px; animation-delay: 0.45s; }
    @keyframes assemble {
      from {
        opacity: 0;
        transform: translate(var(--tx), var(--ty)) scale(0.88);
      }
      to {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .bar {
        animation: none;
        opacity: 1;
        transform: none;
      }
    }
  </style>
  <g class="bar bar--horizontal">
    <path d="M17 27C19.7614 27 22 29.2386 22 32L22 34C22 36.7614 19.7614 39 17 39L0 39L0 27L17 27Z" fill="#A3A3A3"/>
  </g>
  <g class="bar bar--top">
    <path d="M38 17C38 19.7614 35.7614 22 33 22L31 22C28.2386 22 26 19.7614 26 17L26 0L38 0L38 17Z" fill="#A3A3A3"/>
  </g>
  <g class="bar bar--bottom">
    <path d="M26 47C26 44.2386 28.2386 42 31 42H33C35.7614 42 38 44.2386 38 47V64H26V47Z" fill="#A3A3A3"/>
  </g>
  <g class="bar bar--diag-top">
    <path d="M68 32H73.9731C77.074 32 78.9956 28.6242 77.4125 25.9578L62 0H50L68 32Z" fill="#A3A3A3"/>
  </g>
  <g class="bar bar--diag-bottom">
    <path d="M74 64H87L68 32H64.5492C60.7251 32 58.3165 36.1183 60.1914 39.4513L74 64Z" fill="#A3A3A3"/>
  </g>
</svg>
